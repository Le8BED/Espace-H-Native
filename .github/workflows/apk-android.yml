# Fabrique l'APK Android de l'application Espace H sur GitHub (gratuit).
# Lancement : onglet « Actions » du dépôt › « APK Android (test) » › « Run workflow »
# (ou automatiquement à chaque envoi sur la branche main).
# Résultat : en bas de la page du lancement, « Artifacts » › Espace-H-apk (fichier .zip contenant l'APK).
# L'APK est signée avec la clé de test : à installer sur la tablette pour essayer,
# pas à publier sur le Play Store (pour le Store : EAS, voir LISEZ-MOI.md).
name: APK Android (test)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # publication de l'APK (Releases) pour le site

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Dépendances
        # .npmrc : legacy-peer-deps (conflit de versions entre paquets Expo / react-dom)
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Projet Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Fabrication de l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Nom du fichier
        id: nom
        run: |
          V=$(node -p "require('./app.json').expo.version")
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "Espace-H-${V}-test.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "Espace-H.apk"

      # Publication : le site (agencehimmobilier.com/telecharger/espace-h.apk)
      # propose toujours la dernière publication.
      - name: Publication (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.nom.outputs.version }}-${{ github.run_number }}
          name: Espace H ${{ steps.nom.outputs.version }} (fabrication ${{ github.run_number }})
          body: Application Android Espace H — fabriquée automatiquement depuis ${{ github.sha }}.
          make_latest: true
          files: Espace-H.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Espace-H-apk
          path: Espace-H-*-test.apk
          retention-days: 30
